name: Build Android test APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and bundle game
        run: |
          node tests/game.test.js
          node tests/story.test.js
          node tests/milestones.test.js
          python3 build.py
      - name: Install Android platform
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build and lint Android app
        working-directory: android
        run: ./gradlew --no-daemon --max-workers=2 assembleDebug lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: clickclickboom-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
