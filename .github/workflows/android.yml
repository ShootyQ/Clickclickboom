name: Build Android test APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      # This image includes the Android SDK and sdkmanager. Avoid reinstalling
      # command-line tools through a separate setup action.
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and bundle game
        run: |
          node tests/game.test.js
          node tests/story.test.js
          node tests/milestones.test.js
          python3 build.py
      - name: Install Android platform
        run: |
          sdk_root="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          if [ ! -f "$sdk_root/platforms/android-36/android.jar" ] || [ ! -f "$sdk_root/build-tools/36.0.0/aapt2" ]; then
            sdk_manager=$(find "$sdk_root/cmdline-tools" -path '*/bin/sdkmanager' -type f -print -quit)
            test -n "$sdk_manager"
            "$sdk_manager" --sdk_root="$sdk_root" 'platforms;android-36' 'build-tools;36.0.0'
          fi
      - name: Build and lint Android app
        working-directory: android
        run: ./gradlew --no-daemon --max-workers=2 assembleDebug lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: squish-squish-spat-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
